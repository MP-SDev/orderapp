<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <script src="./scripts/standard.js"></script>
    <script src="./scripts/db.js"></script>
    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>
</head>
<body onload="renderMenu(); renderBasket()">
    <header>
        <div class="headerContainer content">
            <img src="./assets/img/Logo_02.png" alt="logo burgerhouse">
            <img src="./assets/img/menu.png" alt="logo nav bar">
        </div>
    </header>
    <main>
        <div class="descCompany content">
            <div class="descHeroImg"></div>
            <img class="descLogoImg" src="./assets/img/logo_burger.png" alt="logo burger">
            <h1>BurgerHouse</h1>
            <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
        </div>
        <div class="menuBasketContainer">
            <div id="menuSections" class="menuContainer">
                
            </div>
            <div id="basketContainer" class="basketContainer">
               
            </div>
        </div>
        <div id="orderConfirmationModal" class="orderConfirmationModal">
            <div class="orderConfirmationModalContent">
                <span onclick="closeModal()" class="closeModal">&times;</span>
                <img src="./assets/img/confirmation.png" alt="picture order confirmation">
                <h3>Order confirmed!</h3>
                <p>Your food is on the way!</p>
            </div>
        </div>
    </main>
    <footer>
        <div class="footerContainer">
            <div class="footerCopyright">
                <img src="./assets/icons/copyright.png" alt="icon copyright">
                <p>BurgerHouse</p>
            </div>
            <p>Imprint</p>
            <p>Cookie Preferences</p>
        </div>
    </footer>
</body>
</html>
